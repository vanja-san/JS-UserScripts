name: Bump thesaurus version

# Словарь версионируется отдельно от кода движка: @require несёт ?v=<метка>.
# Это позволяет выкатить только новые переводы, не трогая логику.
# Без этого пользователи месяцами получают залипший словарь из кэша менеджера.

on:
  push:
    branches: ["main"]
    paths:
      - 'scripts/Nexus Russian Localizer/translations.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: scripts/Nexus Russian Localizer

      - name: Unit tests
        run: node --test tests
        working-directory: scripts/Nexus Russian Localizer

      - name: Align @require cache-buster with @version
        run: node .github/bump-version.js

      - name: Commit
        run: |
          if git diff --quiet -- "scripts/Nexus Russian Localizer/NRL.user.js"; then
            echo "Версия уже совпадает с датой коммита словаря — ничего делать не нужно."
            exit 0
          fi
          version=$(sed -n -E 's|^// @version +(.+)$|\1|p' "scripts/Nexus Russian Localizer/NRL.user.js")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "scripts/Nexus Russian Localizer/NRL.user.js"
          git commit -m "NRL: bump thesaurus version to $version"
          git push