name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # В пути есть пробел, поэтому шаги запускаются из каталога скрипта.
        # Так не нужно экранировать имя папки в каждой команде.
        working-directory: scripts/Nexus Russian Localizer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        run: |
          find . -name '*.js' -not -path './.cache/*' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        # Явные файлы, а не каталог: node --test <dir> на Node 22 выполняет
        # каталог как модуль и падает с MODULE_NOT_FOUND
        # (nodejs/node#64555). Node 26 такой случай принимает, поэтому
        # локально на новой версии баг не воспроизводится.
        run: node --test tests/*.test.js