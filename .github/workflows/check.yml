name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: node --test "scripts/Nexus Russian Localizer/tests"
